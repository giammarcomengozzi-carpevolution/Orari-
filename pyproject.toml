[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orari-agent"
version = "0.1.0"
description = "Agente base per generare orari settimanali di CarpeEvolution Store e Tenuta del Germano"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=22.7,<23",
    "python-dotenv>=1.0,<2",
    "openpyxl>=3.1,<4",
    "openai>=1.0,<2",
]
authors = [{ name = "CarpeEvolution" }]

[project.scripts]
orari-agent = "orari_agent.cli:main"
orari-telegram-bot = "orari_agent.bot_runner:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
