[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orari-agent"
version = "0.1.0"
description = "Agente base per generare orari settimanali di CarpeEvolution Store e Tenuta del Germano"
requires-python = ">=3.11"
authors = [{ name = "CarpeEvolution" }]

[project.scripts]
orari-agent = "orari_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
